[LaunchApps]
# Appending entries to LaunchApps overrides the standard setup.exe shell loop.
# It forces your custom tools to initialize sequentially upon WinPE kernel startup.
%SYSTEMROOT%\System32\cmd.exe, "/k VerifyRuntimeBoundaries.exe"
%SYSTEMROOT%\System32\cmd.exe, "/k AuditMeasuredBootLog.exe"
%SYSTEMROOT%\System32\setup.exe
